name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing and deploy secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SSH_KEY: ${{ secrets.SCANER_SSH_KEY }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$SSH_KEY" ]; then
            echo "Add repository secrets ANDROID_KEYSTORE_BASE64 and SCANER_SSH_KEY."
            echo "On the server: bash /opt/scaner/server/scripts/set-github-actions-secrets.sh"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Read version
        id: ver
        run: |
          code=$(grep -m1 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+')
          name=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish APK on the server
        env:
          SSH_KEY: ${{ secrets.SCANER_SSH_KEY }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/scaner_ci"
          chmod 600 "$HOME/.ssh/scaner_ci"
          ssh -i "$HOME/.ssh/scaner_ci" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            root@37.252.21.72 \
            "publish ${VERSION_CODE} ${VERSION_NAME} GitHubActions" \
            < app/build/outputs/apk/debug/app-debug.apk
